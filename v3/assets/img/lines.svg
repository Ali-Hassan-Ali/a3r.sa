<svg width="1440" height="180" viewBox="0 0 1440 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A quiet horizon line that climbs in measured steps: the governance score
       improving over time. Kept flat and faint so it stays backdrop. -->
  <path d="M-40 150 L170 150 L170 132 L400 132 L400 110 L640 110 L640 118 L870 118 L870 88 L1100 88 L1100 62 L1320 62 L1320 44 L1480 44"
        stroke="url(#rise)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-40 168 L230 168 L230 158 L470 158 L470 148 L720 148 L720 142 L960 142 L960 126 L1210 126 L1210 108 L1480 108"
        stroke="url(#base)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#33a0ab">
    <circle cx="400" cy="110" r="2.5" opacity="0.18"/>
    <circle cx="870" cy="88" r="2.5" opacity="0.2"/>
    <circle cx="1100" cy="62" r="2.5" opacity="0.22"/>
    <circle cx="1320" cy="44" r="3" opacity="0.24"/>
  </g>
  <defs>
    <linearGradient id="rise" x1="-40" y1="100" x2="1480" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33a0ab" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#33a0ab" stop-opacity="0.2"/>
      <stop offset="0.82" stop-color="#33a0ab" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#33a0ab" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="-40" y1="145" x2="1480" y2="145" gradientUnits="userSpaceOnUse">
      <stop stop-color="#33a0ab" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#33a0ab" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#33a0ab" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
