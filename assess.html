<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قيم جمعيتك - أثر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --text-muted: #64748B;
    --border: #E2E8F0; --accent: #1E5C54; --accent-soft: #EAF3F1; --accent-soft-strong: #D6E7E3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    direction: rtl; -webkit-font-smoothing: antialiased; padding: 24px;
  }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    max-width: 440px; width: 100%; padding: 40px 32px; text-align: center;
    box-shadow: 0 1px 2px 0 rgba(15,23,42,0.04);
  }
  .mark { width: 44px; height: 90px; margin: 0 auto 20px; display: block; }
  h1 { font-size: 19px; margin: 0 0 10px; }
  p { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin: 0 0 24px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 22px; font-size: 13px; font-weight: 600; border-radius: 6px;
    background: var(--accent); color: #fff; text-decoration: none;
  }
  .btn:hover { background: #174A44; }
  .back { display: block; margin-top: 16px; font-size: 11.5px; color: var(--text-muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
</style>
</head>
<body class="font-sans antialiased">
  <div class="card">
    <img class="mark" src="images/athar-logo.png" alt="أثر">
    <h1>قيّم جمعيتك</h1>
    <p>أداة التقييم الذاتي أصبحت الآن جزءًا من المنصة الكاملة، وتتطلب تسجيل الدخول للوصول إليها.</p>
    <a class="btn" href="http://a3r.test/assess">الذهاب إلى أداة التقييم</a>
    <a class="back" href="index.html">العودة إلى الرئيسية</a>
  </div>
</body>
</html>
